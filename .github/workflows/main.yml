name: Executar Automação de Dados Diária

on:
  schedule:
    # Horários em UTC (BRT = UTC-3)

    # 06h00 BRT (Manhã)
    - cron: '0 9 * * 1-5'

    # 12h00 BRT (Meio-dia)
    - cron: '0 15 * * 1-5'

    # 21h00 BRT (Noite)
    - cron: '0 0 * * 2-6'
  
  # Permite execução manual pelo painel do GitHub
  workflow_dispatch:

concurrency:
  group: automation-data
  cancel-in-progress: true

jobs:
  build:
    name: Executar Automação de Dados
    runs-on: ubuntu-latest

    # Dá permissão para o token do GitHub Actions fazer alterações no repositório (Push)
    permissions:
      contents: write

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Fuso Horário Local
      run: sudo timedatectl set-timezone America/Sao_Paulo

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Executa o script que vai atualizar ou criar os CSVs dentro de ./data
    - name: Executar script de processamento
      env:
        ORACLE_DB_USER: ${{ vars.ORACLE_DB_USER }}
        ORACLE_DB_PASSWORD: ${{ vars.ORACLE_DB_PASSWORD }}
        ORACLE_DB_DSN: ${{ vars.ORACLE_DB_DSN }}
        ORACLE_DB_WALLET_PASSWORD: ${{ vars.ORACLE_DB_WALLET_PASSWORD }}
        ORACLE_DB_WALLET_BASE64: ${{ vars.ORACLE_DB_WALLET_BASE64 }}
      # O "|| true" força o terminal a entender que a execução terminou com sucesso mesmo se o Python falhar
      run: |
        if [ -n "$ORACLE_DB_WALLET_BASE64" ]; then
          echo "Decoding Oracle Wallet..."
          mkdir -p /tmp/oracle_wallet
          echo "$ORACLE_DB_WALLET_BASE64" | base64 -d > /tmp/oracle_wallet.zip
          unzip -o /tmp/oracle_wallet.zip -d /tmp/oracle_wallet
          export ORACLE_DB_WALLET_DIR=/tmp/oracle_wallet
        fi
        python run_all.py || true

    # Gera o JSON consolidado com todos os ratings para a tela de consulta
    - name: Gerar JSON de consulta
      run: python scripts/gerar_consulta_json.py

    # Gera relatório de movimentações de ratings e anexa no Step Summary do GitHub Actions
    - name: Publicar Relatório de Movimentações de Ratings
      run: |
        python scripts/gerar_relatorio_mudancas.py || true
        if [ -f data/movimentacoes_ratings.md ]; then
          cat data/movimentacoes_ratings.md >> $GITHUB_STEP_SUMMARY
        fi

    # Identifica mudanças na pasta data/ e faz o push se houver novos dados
    - name: Commitar e enviar novas alterações de dados
      run: |
        # Configura o Git com o usuário padrão do robô do GitHub
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Adiciona apenas as modificações da pasta data
        git add data/
        
        # O "|| echo" evita que o workflow falhe caso o script rode mas não mude nada nos arquivos
        git commit -m "Bot: Atualização automática de dados [skip ci]" || echo "Nenhuma alteração nos dados hoje."
        
        # Envia as alterações de volta para a branch main
        git push origin main
    # Publica automaticamente no repositório público (PulseRatingsBrasil-web)
    - name: Publicar no Repositório Público (PulseRatingsBrasil-web)
      if: ${{ secrets.WEB_DEPLOY_TOKEN != '' }}
      env:
        WEB_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
      run: |
        mkdir -p /tmp/web_deploy
        cp index.html consulta.html /tmp/web_deploy/
        if [ -d assets ]; then cp -r assets /tmp/web_deploy/; fi
        mkdir -p /tmp/web_deploy/data
        cp -r data/* /tmp/web_deploy/data/
        sed -i 's|PulseRatingsBrasil/main/data|PulseRatingsBrasil-web/main/data|g' /tmp/web_deploy/data/datasets.json
        sed -i 's|PulseRatingsBrasil/consulta.html|PulseRatingsBrasil-web/consulta.html|g' /tmp/web_deploy/consulta.html
        sed -i 's|PulseRatingsBrasil/|PulseRatingsBrasil-web/|g' /tmp/web_deploy/index.html
        touch /tmp/web_deploy/.nojekyll
        
        cd /tmp/web_deploy
        git init -b main
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Deploy automático dos dados: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        git push --force https://x-access-token:${WEB_TOKEN}@github.com/PulseDataLabs/PulseRatingsBrasil-web.git main || echo "Aviso: Falha ao sincronizar repo público."
